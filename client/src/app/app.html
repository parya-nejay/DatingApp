<div class="card bg-base-100 w-1/2 mx-auto p-10 mt-10 shadow-xl">
    <h3 class="text-3xl text-red-500 font-bold">{{title}}</h3>
    <ul class="list">
          @for (member of members(); track member.id) {
    <li class="list-row items-center">
        <img src="/user.png.png" alt="User avatar" class="w-12 h-12 rounded-full mr-4">
        <div>
            <p class="font-bold">{{member.displayName}}</p>
    
        </div>

    </li> }   
    

</ul>
</div>
